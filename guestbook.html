<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 - CYAN-08's Homepage</title>
<style>
  /* Web 1.0 经典样式 */
  body {
    background-color: #c0c0c0;
    background-image: repeating-linear-gradient(45deg, #c0c0c0 0px, #c0c0c0 2px, #b8b8b8 2px, #b8b8b8 4px);
    color: #000000;
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    margin: 8px;
  }
  
  a { color: #0000ee; text-decoration: underline; }
  a:visited { color: #551a8b; }
  a:hover { color: #ff0000; }
  
  hr { border: 1px inset #808080; margin: 16px 0; }

  .page {
    max-width: 720px;
    margin: 0 auto;
    background: #ffffff;
    border: 4px ridge #00838f;
    padding: 0;
  }

  .header {
    background: #00838f;
    color: #ffff00;
    text-align: center;
    padding: 16px 8px;
    font-family: "Courier New", monospace;
  }
  .header h1 {
    font-size: 24px;
    margin: 0;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000000;
  }

  .nav {
    background: #e0e0e0;
    border-top: 1px solid #808080;
    border-bottom: 1px solid #808080;
    padding: 6px 10px;
    font-size: 13px;
    text-align: center;
  }
  .nav a { margin: 0 8px; }
  .nav .text-item { margin: 0 8px; color: #808080; }

  .content { padding: 16px 20px; }
  
  .content h2 {
    font-size: 18px;
    color: #00838f;
    border-bottom: 2px solid #00838f;
    padding-bottom: 4px;
    margin: 16px 0 8px;
    font-family: "Courier New", monospace;
  }

  /* 留言板特有样式 */
  .comment-box {
    background: #f9f9f9;
    border: 1px solid #a0a0a0;
    padding: 12px;
    margin-bottom: 12px;
  }
  
  .comment-header {
    border-bottom: 1px dashed #c0c0c0;
    padding-bottom: 6px;
    margin-bottom: 8px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .comment-user {
    font-weight: bold;
    color: #00838f;
  }
  
  .comment-badge {
    background: #ffff00;
    color: #000;
    border: 1px solid #000;
    padding: 1px 4px;
    font-size: 11px;
    font-weight: normal;
    margin-left: 6px;
  }

  .comment-time {
    color: #808080;
    font-family: "Courier New", monospace;
  }

  .comment-body {
    font-size: 14px;
    line-height: 1.6;
  }

  /* 留言表单（只读假装） */
  .form-area {
    background: #e8e8e8;
    border: 2px inset #808080;
    padding: 16px;
    margin-top: 20px;
  }
  .form-area p { margin-bottom: 12px; font-size: 13px; font-weight: bold; }
  .form-area input, .form-area textarea {
    width: 100%;
    background: #d0d0d0;
    border: 2px inset #ffffff;
    padding: 6px;
    margin-bottom: 12px;
    font-family: "Courier New", monospace;
    color: #808080;
    cursor: not-allowed;
  }
  .form-area textarea { height: 80px; resize: none; }
  
  .submit-btn {
    background: #c0c0c0;
    border: 3px outset #ffffff;
    padding: 4px 16px;
    font-family: "MS Gothic", "Courier New", monospace;
    font-weight: bold;
    color: #808080;
    cursor: not-allowed;
    width: auto !important;
  }

  .footer {
    background: #e0e0e0;
    border-top: 2px groove #00838f;
    padding: 12px;
    text-align: center;
    font-size: 11px;
    color: #404040;
  }
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <h1>★ 留言板 / GUESTBOOK ★</h1>
  </div>

  <div class="nav">
    <a href="index.html">主页</a> |
    <a href="https://cyan-08.github.io/noodlefan/" target="_blank">我的小说</a> |
    <span class="text-item">关于我</span> |
    <a href="guestbook.html">留言板</a> |
    <span class="text-item">友情链接</span>
  </div>

  <div class="content">
    
    <h2>■ 游客留言 (Comments)</h2>
    
    <!-- 置顶留言 -->
    <div class="comment-box" style="background:#fffdf0; border: 2px solid #00838f;">
      <div class="comment-header">
        <div>
          <span class="comment-user">CYAN-08</span>
          <span class="comment-badge">【管理猿】</span>
          <span class="comment-badge" style="background:#ff0000; color:#fff;">【置顶】</span>
        </div>
        <div class="comment-time">1970-01-01 08:00:00</div>
      </div>
      <div class="comment-body">
        留言板还在测试阶段哦！
      </div>
    </div>

    <!-- 普通留言区为空 -->
    <p style="text-align:center; color:#808080; font-size:12px; margin: 20px 0;">—— 暂无其他留言 ——</p>

    <hr>

    <h2>■ 发表留言 (Leave a Message)</h2>
    
    <div class="form-area">
      <p>抱歉，您没有权限在此留言。（Error: 403 Forbidden）</p>
      
      <!-- 伪表单，全部只读禁用 -->
      <input type="text" placeholder="您的名字" disabled>
      <textarea placeholder="留言内容……" disabled></textarea>
      <button class="submit-btn" disabled>发送留言</button>
    </div>

  </div>

  <div class="footer">
    Copyright &copy; <span id="year"></span> CYAN-08. All Rights Reserved.<br>
    <span style="color:#808080;">Unix Time: 0</span>
  </div>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
